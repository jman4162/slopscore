# Insight-signaling / pseudo-profundity: phrases whose job is to announce that insight is
# occurring rather than to contain it. Borrowed from a higher-prestige essayist/rationalist
# register (Substack, LessWrong, Stratechery, Paul Graham), where they are sharp the first time
# and empty at uniform density. The tell is density, not a single occurrence — the scorer already
# scores severity-weighted density per 100 words, so patterns here stay context-gated to keep a
# lone, legitimate use from firing.
#
# This is the CORE (conservative) tier, on by default. See ../insight_signaling_broad/ for the
# opt-in `--broad` tier of rationalist jargon with higher false-positive risk.
# Sources: user-reported 2024-2026 LLM tells; register discussion in AI_WRITING_SLOP_Guide.

rules:
  - rule_id: INSIGHT_LOAD_BEARING
    severity: medium
    # Gated to prose nouns so the literal engineering sense ("load-bearing wall/beam/column") is
    # left alone. Three arms: attributive ("a load-bearing assumption"), predicative ("this
    # distinction is load-bearing" — the commonest form, and the one that had no rule through
    # v0.13), and "<prose noun> is doing the load-bearing work". ALL THREE arms are gated to
    # the same prose-noun list, which excludes every noun with a literal construction sense
    # (part, framing, detail, fact, point, work): in carpentry the framing IS the load-bearing
    # structure, "load-bearing point" is a term of art, and "the crew is doing load-bearing
    # work" is a job description. An ungated third arm fired on all of them.
    pattern: "\\b(?:load[-\\s]?bearing\\s+(?:word|phrase|term|assumption|premise|claim|sentence|clause|idea|concept|distinction|caveat|qualifier|hedge|adverb|comma|adjective|footnote)s?\\b|(?:this|that|the|these|those|its|their|our|my|his|her)\\s+(?:\\w+\\s+){0,2}?(?:word|phrase|term|assumption|premise|claim|sentence|clause|idea|concept|distinction|caveat|qualifier|hedge|adverb|comma|adjective|footnote)s?\\s+(?:is|are|was|were|remains?|seems?|feels?)\\s+(?:very |highly |really |quite |genuinely |extremely |entirely |especially )?load[-\\s]?bearing\\b|(?:this|that|the|these|those|its|their|our|my|his|her)\\s+(?:\\w+\\s+){0,2}?(?:word|phrase|term|assumption|premise|claim|sentence|clause|idea|concept|distinction|caveat|qualifier|hedge|adverb|comma|adjective|footnote)s?\\s+(?:is|are)\\s+doing\\s+(?:the\\s+|a lot of the\\s+|most of the\\s+)?load[-\\s]?bearing\\s+work\\b)"
    explanation: "'load-bearing' applied to prose — insight-signaling metaphor; say what the word or assumption does."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_REAL_WORK
    severity: medium
    # Adjective is mandatory so plain "doing the work" is left alone.
    pattern: "\\bdoing (?:the |all |most of |a lot of )?(?:the )?(?:real|heavy|actual) (?:work|lifting)\\b"
    explanation: "'doing the real work / heavy lifting' — vague emphasis dressed as analysis."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_WORK_IN_SENTENCE
    severity: medium
    pattern: "\\bdoing (?:a lot of|the|serious|real|all the) work in (?:that|this|the) (?:sentence|phrase|word|clause|framing|paragraph)\\b"
    explanation: "'doing a lot of work in that sentence' — asserts importance without showing it."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_CRUX
    severity: low
    pattern: "\\bthe crux of (?:the|this) (?:issue|matter|argument|problem|question|debate)\\b"
    explanation: "'the crux of the issue' — pseudo-profound framing of an ordinary point."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_PRESSURE_TEST
    severity: low
    pattern: "\\b(?:pressure|stress)[-\\s]?test\\w* (?:the|this|that|your|our|my) (?:claim|assumption|argument|thesis|hypothesis|premise|logic|idea)\\b"
    explanation: "'pressure-test the claim' — analysis-flavoring verb."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_OPERATIVE
    severity: low
    pattern: "\\bthe operative (?:word|term|question|phrase) (?:here )?is\\b"
    explanation: "'the operative word is' — emphasis marker posing as an argument."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_SIGNAL_NOISE
    severity: low
    pattern: "\\bseparat\\w+ (?:the )?signal from (?:the )?noise\\b"
    explanation: "'separate signal from noise' — stock analytical cliche."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_QUIETLY
    severity: low
    pattern: "\\bquietly (?:the )?(?:most|one of the most|the single most|becoming)\\b"
    explanation: "'quietly the most important' — 'quietly' as a profundity intensifier."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_UNCOMFORTABLE_TRUTH
    severity: medium
    pattern: "\\bhere(?:'s| is) the (?:uncomfortable|hard|inconvenient|real|deeper) truth\\b"
    explanation: "'here's the uncomfortable truth' — dramatized reveal scaffold."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_WHOLE_GAME
    severity: low
    pattern: "\\bthat'?s the (?:whole|entire) (?:game|ballgame)\\b"
    explanation: "'that's the whole game' — emphatic filler."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_NOT_NOTHING
    severity: low
    # Litotes-as-emphasis, in the same family as INSIGHT_WHOLE_GAME and INSIGHT_FULL_STOP: it
    # asserts significance without supplying any. Gated to the pronoun subject so ordinary
    # negation ("the result is not nothing more than noise") is unaffected.
    pattern: "\\b(?:it'?s|that'?s|this is|which is) not nothing\\b"
    explanation: "'it's not nothing' — litotes used to assert significance without supplying it."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_FULL_STOP
    severity: low
    pattern: "\\b\\w+, full stop[.]"
    explanation: "'X, full stop.' — manufactured finality."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_IS_THE_POINT
    severity: low
    pattern: "\\bthe \\w+ is the (?:whole )?point\\b"
    explanation: "'the <noun> is the point' — reframes the obvious as an insight."
    source: "AI-tell (2024-2026)"

  - rule_id: INSIGHT_STRUCTURAL_METAPHOR
    severity: medium
    # Anatomical/structural metaphor for an organizing principle. Gated to prose/argument nouns so
    # literal senses (backbone network, construction scaffolding, book spine) are left alone.
    pattern: "\\b(?:the )?(?:spine|backbone|connective tissue|beating heart|scaffolding|through-?line) of (?:the|this|that|my|our|your|a|an) (?:list|argument|essay|piece|post|guide|case|thesis|claim|approach|strategy|framework|plan|idea|narrative|story)\\b"
    explanation: "'the spine/backbone of the argument' — structural metaphor for an organizing principle; say what it is."
    source: "human-reader catch, Summitward finance-books guide (2026-07)"

  - rule_id: INSIGHT_STRUCTURAL_COPULA
    severity: medium
    # Copular form ("The spine is the same evidence..."). Complement is gated to abstract/argument
    # nouns so literal subjects ("The spine is a column of vertebrae", "The backbone is a fiber
    # link") do not fire.
    pattern: "\\bthe (?:spine|backbone|through-?line) (?:of [\\w\\s]{1,30} )?is (?:the|our|its|a) (?:same |real |whole |central |underlying |actual )?(?:evidence|argument|thesis|idea|logic|case|point|reason|principle|claim|through-?line|story|framework)\\b"
    explanation: "'the spine is the <evidence/argument>' — anatomy metaphor for an organizing principle."
    source: "human-reader catch, Summitward finance-books guide (2026-07)"
