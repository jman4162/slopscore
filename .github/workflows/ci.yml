name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (dev deps)
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      # Dogfood: the repository's own prose must stay under the score gate. Severity is not
      # gated here because the docs quote slop examples on purpose.
      - name: Dogfood
        run: uv run slopscore-lint scan README.md MODEL_CARD.md CHANGELOG.md CLAUDE.md docs --recursive --fail-on-score 50

  # The optional extras never ran in the default job (their tests skip without the packages), so
  # the HTML renderer, spaCy path, embedding redundancy, and lingua detection were untested in CI.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync with extras
        run: uv sync --extra nlp --extra report --extra lang
      # Install the model wheel directly: `spacy download` shells out to pip, which uv venvs lack.
      - name: spaCy model
        run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Tests (extras must not skip)
        run: uv run pytest -q -rs

  # Build the wheel, install it into a clean interpreter, and run the console script. pytest
  # imports from src/ via pythonpath, so it cannot catch a wheel that ships without the CLI.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Install wheel into a clean venv and smoke the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/slopscore-lint --help > /dev/null
          /tmp/smoke/bin/slopscore-lint scan README.md --format json > /tmp/readme.json
          /tmp/smoke/bin/python -c "import json; r = json.load(open('/tmp/readme.json')); assert r['score']['label'] == 'low', r['score']"
