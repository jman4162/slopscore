name: slopscore-lint
description: Scan prose for AI-slop writing patterns (a linter, not an authorship detector).
branding:
  icon: "edit-3"
  color: "purple"

inputs:
  files:
    description: File or directory to scan.
    required: false
    default: "."
  recursive:
    description: Recurse into directories.
    required: false
    default: "true"
  profile:
    description: "Genre profile: blog | essay | academic | marketing | technical | social."
    required: false
    default: "blog"
  fail-on:
    description: "Fail the job if any finding reaches this severity: none | low | medium | high."
    required: false
    default: "high"
  fail-on-score:
    description: "Fail the job if any non-abstained document scores at or above this (0-100). Empty = off."
    required: false
    default: ""
  version:
    description: "slopscore-lint version to install from PyPI (pinned per action release)."
    required: false
    default: "0.12.0"
  upload-sarif:
    description: Upload results to GitHub code scanning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install slopscore
      shell: bash
      env:
        SLOP_VERSION: ${{ inputs.version }}
      run: python -m pip install "slopscore-lint==${SLOP_VERSION}"

    # Inputs are passed through `env:` and quoted, never interpolated into the script body, so an
    # input derived from untrusted event data cannot inject shell.
    - name: Scan
      id: scan
      shell: bash
      env:
        SLOP_FILES: ${{ inputs.files }}
        SLOP_RECURSIVE: ${{ inputs.recursive }}
        SLOP_PROFILE: ${{ inputs.profile }}
        SLOP_FAIL_ON: ${{ inputs.fail-on }}
        SLOP_FAIL_ON_SCORE: ${{ inputs.fail-on-score }}
      run: |
        args=()
        [ "$SLOP_RECURSIVE" = "true" ] && args+=(--recursive)
        [ -n "$SLOP_FAIL_ON_SCORE" ] && args+=(--fail-on-score "$SLOP_FAIL_ON_SCORE")
        slopscore-lint scan "$SLOP_FILES" "${args[@]}" \
          --profile "$SLOP_PROFILE" \
          --fail-on "$SLOP_FAIL_ON" \
          --format sarif --output slopscore.sarif

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      # Needs `security-events: write` in the caller; tolerate its absence rather than hard-fail
      # (the scan step already fails the job by --fail-on).
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: slopscore.sarif
        category: slopscore
